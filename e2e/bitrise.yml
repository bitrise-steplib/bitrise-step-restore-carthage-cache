format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  # The test sample's Alamofire dependency does not compile on the Xcode-27 beta
  # stack, so the Carthage-dependent steps are skipped on osx-xcode-edge.
  test_carthage:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/Bitrise-iOS-Carthage-Sample.git
    - BRANCH: main
    before_run:
    - _setup
    steps:
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
    - carthage:
        run_if: "{{ not (enveq \"BITRISEIO_STACK_ID\" \"osx-xcode-edge\") }}"
        inputs:
        - carthage_command: bootstrap
        - carthage_options: --use-xcframeworks --platform iOS
        - verbose_log: "yes"
    - git::git@github.com:bitrise-steplib/bitrise-step-save-cache.git:
        run_if: "{{ not (enveq \"BITRISEIO_STACK_ID\" \"osx-xcode-edge\") }}"
        is_skippable: false
        inputs:
        - key: |-
            {{ .Arch }}-carthage-cache-{{ checksum "**/Cartfile.resolved" }}
        - paths: |-
            **/Carthage/Build
            **/Carthage/Cachefile
        - verbose: "true"
    - script:
        title: Remove Carthage folder
        run_if: "{{ not (enveq \"BITRISEIO_STACK_ID\" \"osx-xcode-edge\") }}"
        inputs:
        - content: |-
            set -ex
            rm -rf Carthage
    - path::./:
        title: Execute step
        run_if: "{{ not (enveq \"BITRISEIO_STACK_ID\" \"osx-xcode-edge\") }}"
        is_skippable: false
        inputs:
        - verbose: "true"
    - script:
        title: Check restored cache
        run_if: "{{ not (enveq \"BITRISEIO_STACK_ID\" \"osx-xcode-edge\") }}"
        inputs:
        - content: |
            set -ex

            echo $BITRISE_CACHE_HIT
            if [ ! -d Carthage/Build ]; then
              echo "Carthage/Build directory doesn't exist"
              exit 1
            fi
    - carthage:
        title: Carthage bootstrap again
        run_if: "{{ not (enveq \"BITRISEIO_STACK_ID\" \"osx-xcode-edge\") }}"
        inputs:
        - carthage_command: bootstrap
        - carthage_options: --use-xcframeworks --platform iOS
        - verbose_log: "yes"

  test_empty:
    description: |
      Tests the case when there is nothing to compress based on the cache paths. The step returns early in this case
      with a 0 exit code
    steps:
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - path::./:
        title: Execute step
        run_if: "true"
        is_skippable: false
        inputs:
        - verbose: "true"

  _setup:
    steps:
    - script:
        title: Delete _tmp dir
        inputs:
        - content: rm -rf _tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - clone_into_dir: ./_tmp
        - branch: $BRANCH
